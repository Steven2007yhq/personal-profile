{% extends "_auth_base.html" %}
{% block title %}注册{% endblock %}
{% block heading %}创建账号{% endblock %}
{% block subtitle %}注册后即可登录进入个人主页{% endblock %}

{% block form %}
<form method="POST" action="{{ url_for('register') }}">
    <input type="hidden" name="_csrf" value="{{ csrf_token() }}">
    <div class="form-group">
        <label for="username">用户名</label>
        <input type="text" id="username" name="username" value="{{ username|default('') }}"
               autocomplete="username" autofocus required
               minlength="3" maxlength="20" pattern="[A-Za-z0-9_\-]{3,20}">
        <p class="hint">3–20 位，字母、数字、下划线或连字符</p>
    </div>
    <div class="form-group">
        <label for="password">密码</label>
        <input type="password" id="password" name="password"
               autocomplete="new-password" required minlength="8">
        <p class="hint">至少 8 位</p>
    </div>
    <div class="form-group">
        <label for="confirm">确认密码</label>
        <input type="password" id="confirm" name="confirm"
               autocomplete="new-password" required minlength="8">
    </div>
    <button type="submit" class="btn btn-primary">注册</button>
</form>
{% endblock %}

{% block footer %}
<p>已经有账号了？<a href="{{ url_for('login') }}">去登录</a></p>
{% endblock %}
